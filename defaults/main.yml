---
# defaults file for tomcat
action: install

tomcat_version: 9.0.115
tomcat_user: tomcat
tomcat_group: tomcat

tomcat_install_dir: "/opt/apache-tomcat-{{ tomcat_version }}"
tomcat_symlink: /opt/tomcat

tomcat_tar_url: "https://dlcdn.apache.org/tomcat/tomcat-9/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"

java_package:
  Debian: openjdk-11-jdk
  RedHat: java-11-openjdk

