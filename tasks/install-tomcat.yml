- name: Download Tomcat
  get_url:
    url: "{{ tomcat_tar_url }}"
    dest: "/opt/apache-tomcat-{{ tomcat_version }}.tar.gz"

- name: Extract Tomcat
  unarchive:
    src: "/opt/apache-tomcat-{{ tomcat_version }}.tar.gz"
    dest: /opt
    remote_src: yes

- name: Create symlink
  file:
    src: "{{ tomcat_install_dir }}"
    dest: "{{ tomcat_symlink }}"
    state: link

- name: Set ownership
  file:
    path: "{{ tomcat_install_dir }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    recurse: yes

